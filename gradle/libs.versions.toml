[versions]
kotlin = "2.4.21"
junit = "5.11.4"
spotless = "8.10.3"
detekt = "2.0.0-alpha.6"
antlrKotlin = "1.0.14"
luaj = "3.0.1"
vanniktechMavenPublish = "0.37.0"

[libraries]
antlr-kotlin-runtime = { module = "com.strumenta:antlr-kotlin-runtime", version.ref = "antlrKotlin" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "dev.detekt:dev.detekt.gradle.plugin", version.ref = "detekt" }
luaj-jse = { module = "org.luaj:luaj-jse", version.ref = "luaj" }
vanniktech-mavenPublish = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "vanniktechMavenPublish" }

[plugins]
antlr4-kotlin = { id = "com.strumenta.antlr-kotlin", version.ref = "antlrKotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

kotlua-kotlin = { id = "kotlua.kotlin-convention" }
kotlua-root = { id = "kotlua.root" }
kotlua-test-fixtures = { id = "kotlua.test-fixtures" }
kotlua-spotless = { id = "kotlua.spotless" }
kotlua-publishing = { id = "kotlua.publishing" }
kotlua-gradlePlugin = { id = "io.github.kotlua-project" }
